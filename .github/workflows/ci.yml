name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy src tests

      - name: Run unit tests
        run: |
          uv run pytest -q --cov=src/nextcloud_organizer_mcp --cov-report=term-missing \
            --cov-fail-under=90

  caddy-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Install pinned Caddy
        env:
          CADDY_VERSION: "2.11.4"
          CADDY_SHA512: "8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9"
        run: |
          mkdir -p "$RUNNER_TEMP/caddy"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" \
            --output "$RUNNER_TEMP/caddy/caddy.tar.gz"
          echo "$CADDY_SHA512  $RUNNER_TEMP/caddy/caddy.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/caddy/caddy.tar.gz" -C "$RUNNER_TEMP/caddy" caddy
          echo "$RUNNER_TEMP/caddy" >> "$GITHUB_PATH"

      - name: Verify HTTPS proxy, OAuth, MCP streaming, restart, and client IP handling
        env:
          RUN_PROXY_TESTS: "1"
        run: |
          caddy version
          uv run pytest tests/test_proxy_deployment.py -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: nextcloud-organizer-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: scripts/docker-smoke-test.sh nextcloud-organizer-mcp:ci
